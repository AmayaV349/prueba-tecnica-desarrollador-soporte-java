# H2 en memoria para ejecutar sin Oracle. Los scripts Oracle van en la rama de base de datos.
spring:
  datasource:
    url: jdbc:h2:mem:pagoclaro;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
